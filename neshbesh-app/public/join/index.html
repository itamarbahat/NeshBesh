<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>הצטרפות ל-NeshBesh</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #0b0f1a 0%, #1a2138 100%);
      color: #f4f6fb;
      display: flex; align-items: center; justify-content: center;
    }
    main {
      width: 100%; max-width: 420px; padding: 32px 24px; text-align: center;
    }
    h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 0.5px; }
    p.sub { margin: 0 0 28px; color: #aab2c8; font-size: 15px; line-height: 1.5; }
    .code-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 20px 16px;
      margin: 0 0 24px;
    }
    .code-label { font-size: 13px; color: #8c95ad; margin-bottom: 8px; }
    .code { font-size: 36px; font-weight: 700; letter-spacing: 6px; color: #ffd76a; font-family: "SF Mono", Menlo, Consolas, monospace; }
    a.btn {
      display: inline-block; width: 100%; padding: 16px 20px;
      background: #ffd76a; color: #0b0f1a; font-weight: 700; font-size: 17px;
      border-radius: 12px; text-decoration: none; margin-bottom: 12px;
    }
    a.btn.secondary { background: transparent; color: #aab2c8; border: 1px solid rgba(255,255,255,0.18); }
    .hint { font-size: 13px; color: #6f7790; margin-top: 18px; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <h1>NeshBesh</h1>
    <p class="sub">הוזמנת להצטרף למשחק. פתח את האפליקציה כדי לשחק.</p>

    <div class="code-box">
      <div class="code-label">קוד החדר</div>
      <div class="code" id="code">------</div>
    </div>

    <a class="btn" id="openApp" href="#">פתח באפליקציית NeshBesh</a>
    <a class="btn secondary" href="https://neshbesh.app/">חזרה לעמוד הבית</a>

    <p class="hint">אם האפליקציה לא נפתחת אוטומטית, ודא שהיא מותקנת והקש על הכפתור למעלה. ניתן גם להזין את קוד החדר ידנית בתוך האפליקציה.</p>
  </main>

  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var code = (parts[parts.length - 1] || '').toUpperCase();
      if (!code || code === 'JOIN') code = '';
      var codeEl = document.getElementById('code');
      var btn = document.getElementById('openApp');
      if (code) {
        codeEl.textContent = code;
        var deepLink = 'neshbesh://join/' + code;
        btn.href = deepLink;
        setTimeout(function () {
          window.location.href = deepLink;
        }, 500);
      } else {
        btn.style.display = 'none';
      }
    })();
  </script>
</body>
</html>
